<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7ddf5"/>
      <stop offset="1" stop-color="#b8d4f0"/>
    </linearGradient>
    <symbol id="flag" viewBox="0 0 24 24">
      <path d="M6 3 V21" stroke="currentColor" stroke-width="2.5"/>
      <path d="M7 4 H19 L16 8.5 L19 13 H7 Z" fill="currentColor"/>
    </symbol>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#4b5563">RED FLAG EDITOR - opened from /shelter/questions (PHASE 2)</text>
  <text x="40" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#8b5cf6" font-weight="700">DESKTOP (16:9)</text>
  <text x="1500" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#d946ef" font-weight="700">MOBILE</text>

  <!-- ===================== DESKTOP ===================== -->
  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-desktop.svg#desktop-header" x="0" y="0"/>

    <!-- Builder behind the dialog -->
    <text x="40" y="126" font-family="system-ui, sans-serif" font-size="22" fill="#1f2937" font-weight="700">Application questions</text>
    <rect x="40" y="168" width="360" height="464" rx="8" fill="#f5f0e6" stroke="#b8a080"/>
    <rect x="416" y="168" width="824" height="464" rx="8" fill="#f5f0e6" stroke="#b8a080"/>
    <rect width="1280" height="720" rx="8" fill="#000" opacity="0.5"/>

    <!-- Dialog -->
    <g font-family="system-ui, sans-serif" font-size="14">
      <rect x="290" y="96" width="700" height="528" rx="12" fill="#f5f0e6" stroke="#b8a080"/>
      <use href="#flag" x="322" y="124" width="24" height="24" color="#b91c1c"/>
      <text x="354" y="144" font-size="20" fill="#1f2937" font-weight="700">Red flag</text>
      <rect x="930" y="108" width="44" height="44" rx="8" fill="#dcc8a8"/>
      <text x="952" y="137" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700">&#215;</text>

      <text x="322" y="182" font-size="16" fill="#1f2937" font-weight="600">Does your landlord allow this pet?</text>
      <text x="322" y="214" fill="#4b5563">Raise a red flag when the answer is:</text>

      <rect x="322" y="226" width="636" height="44" rx="8" fill="#dcc8a8"/>
      <rect x="334" y="236" width="24" height="24" rx="4" fill="#8b5cf6"/>
      <text x="346" y="254" text-anchor="middle" fill="#fff" font-weight="700">&#10003;</text>
      <text x="372" y="253" fill="#1f2937" font-weight="600">No</text>

      <rect x="322" y="276" width="636" height="44" rx="8" fill="#dcc8a8"/>
      <rect x="334" y="286" width="24" height="24" rx="4" fill="#8b5cf6"/>
      <text x="346" y="304" text-anchor="middle" fill="#fff" font-weight="700">&#10003;</text>
      <text x="372" y="303" fill="#1f2937" font-weight="600">Not asked yet</text>

      <rect x="322" y="326" width="636" height="44" rx="8" fill="#f5f0e6" stroke="#b8a080"/>
      <rect x="334" y="336" width="24" height="24" rx="4" fill="#f5f0e6" stroke="#4b5563" stroke-width="2"/>
      <text x="372" y="353" fill="#1f2937">Yes</text>

      <text x="322" y="400" fill="#4b5563">Label your staff will see</text>
      <rect x="322" y="410" width="636" height="44" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
      <text x="336" y="437" fill="#1f2937">Landlord hasn't approved</text>

      <text x="322" y="482" fill="#4b5563">On the applications dashboard:</text>
      <rect x="540" y="465" width="232" height="26" rx="13" fill="#b91c1c"/>
      <use href="#flag" x="550" y="469" width="18" height="18" color="#ffffff"/>
      <text x="576" y="483" fill="#fff" font-weight="700">Landlord hasn't approved</text>

      <rect x="322" y="500" width="636" height="48" rx="8" fill="#dcc8a8"/>
      <rect x="322" y="500" width="4" height="48" fill="#8b5cf6"/>
      <text x="338" y="520" fill="#1f2937">A flag never rejects an application or changes its status.</text>
      <text x="338" y="539" fill="#1f2937">Only your staff see it; the adopter never does.</text>

      <rect x="322" y="564" width="152" height="44" rx="8" fill="#f5f0e6" stroke="#b91c1c" stroke-width="2"/>
      <text x="398" y="591" text-anchor="middle" fill="#b91c1c" font-weight="700">Turn off flag</text>
      <rect x="730" y="564" width="108" height="44" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
      <text x="784" y="591" text-anchor="middle" fill="#1f2937" font-weight="600">Cancel</text>
      <rect x="850" y="564" width="108" height="44" rx="8" fill="#8b5cf6"/>
      <text x="904" y="591" text-anchor="middle" fill="#fff" font-weight="700">Save flag</text>
    </g>

    <use href="includes/footer-desktop.svg#site-footer" x="0" y="640"/>

    <!-- Callouts -->
    <g class="callout"><circle cx="976" cy="226" r="14" fill="#dc2626"/><text x="976" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff" font-weight="bold">1</text></g>
    <g class="callout"><circle cx="976" cy="410" r="14" fill="#dc2626"/><text x="976" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff" font-weight="bold">3</text></g>
    <g class="callout"><circle cx="976" cy="500" r="14" fill="#dc2626"/><text x="976" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff" font-weight="bold">4</text></g>
    <g class="callout"><circle cx="486" cy="586" r="14" fill="#dc2626"/><text x="486" y="591" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff" font-weight="bold">6</text></g>
  </g>

  <!-- ===================== MOBILE ===================== -->
  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="24" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-mobile.svg#mobile-header-group" x="0" y="0"/>
    <use href="includes/footer-mobile.svg#mobile-bottom-nav" x="0" y="664"/>
    <rect width="360" height="720" rx="19" fill="#000" opacity="0.5"/>

    <g font-family="system-ui, sans-serif" font-size="14">
      <rect x="0" y="176" width="360" height="480" rx="20" fill="#f5f0e6" stroke="#b8a080"/>
      <rect x="156" y="186" width="48" height="5" rx="2.5" fill="#b8a080"/>
      <use href="#flag" x="20" y="204" width="22" height="22" color="#b91c1c"/>
      <text x="50" y="222" font-size="18" fill="#1f2937" font-weight="700">Red flag</text>
      <rect x="296" y="198" width="44" height="44" rx="8" fill="#dcc8a8"/>
      <text x="318" y="227" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700">&#215;</text>

      <text x="20" y="262" fill="#1f2937" font-weight="600">On a typical day, how many hours</text>
      <text x="20" y="280" fill="#1f2937" font-weight="600">will the pet be home alone?</text>
      <text x="20" y="308" fill="#4b5563">Raise a red flag when the answer is:</text>

      <rect x="20" y="318" width="150" height="44" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
      <text x="32" y="345" fill="#1f2937">More than &#9662;</text>
      <rect x="180" y="318" width="72" height="44" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
      <text x="216" y="345" text-anchor="middle" fill="#1f2937" font-weight="700">8</text>
      <text x="262" y="345" fill="#1f2937">hours</text>

      <text x="20" y="390" fill="#4b5563">Label your staff will see</text>
      <rect x="20" y="398" width="320" height="44" rx="6" fill="#dcc8a8" stroke="#b8a080"/>
      <text x="32" y="425" fill="#1f2937">Alone more than 8 hours</text>

      <text x="20" y="470" fill="#4b5563">On the dashboard:</text>
      <rect x="20" y="478" width="232" height="26" rx="13" fill="#b91c1c"/>
      <use href="#flag" x="30" y="482" width="18" height="18" color="#ffffff"/>
      <text x="56" y="496" fill="#fff" font-weight="700">Alone more than 8 hours</text>

      <rect x="20" y="516" width="320" height="64" rx="8" fill="#dcc8a8"/>
      <rect x="20" y="516" width="4" height="64" fill="#8b5cf6"/>
      <text x="34" y="538" fill="#1f2937">Never rejects an application.</text>
      <text x="34" y="558" fill="#1f2937">Only your staff see it.</text>

      <rect x="20" y="596" width="150" height="44" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
      <text x="95" y="623" text-anchor="middle" fill="#1f2937" font-weight="600">Cancel</text>
      <rect x="190" y="596" width="150" height="44" rx="8" fill="#8b5cf6"/>
      <text x="265" y="623" text-anchor="middle" fill="#fff" font-weight="700">Save flag</text>
    </g>

    <!-- Mobile callouts -->
    <g class="callout"><circle cx="340" cy="312" r="11" fill="#dc2626"/><text x="340" y="317" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff" font-weight="bold">2</text></g>
    <g class="callout"><circle cx="340" cy="388" r="11" fill="#dc2626"/><text x="340" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff" font-weight="bold">3</text></g>
    <g class="callout"><circle cx="340" cy="512" r="11" fill="#dc2626"/><text x="340" y="517" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff" font-weight="bold">4</text></g>
  </g>

  <!-- ===================== ANNOTATIONS ===================== -->
  <g id="annotations" transform="translate(40, 800)" font-family="system-ui, sans-serif" font-size="14">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>

    <!-- Row 1 -->
    <g class="callout"><circle cx="34" cy="24" r="14" fill="#dc2626"/><text x="34" y="29" text-anchor="middle" fill="#fff" font-weight="bold">1</text></g>
    <text x="58" y="29" fill="#1f2937" font-weight="700">Answers that raise the flag</text>
    <text x="20" y="52" fill="#374151">As a rescue manager, I tick which answers need a closer</text>
    <text x="20" y="70" fill="#374151">look. Works for yes/no and choice questions.</text>
    <a href="#us-004"><rect x="20" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="56" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-004</text></a>
    <a href="#fr-020"><rect x="98" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="134" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-020</text></a>

    <g class="callout"><circle cx="494" cy="24" r="14" fill="#dc2626"/><text x="494" y="29" text-anchor="middle" fill="#fff" font-weight="bold">2</text></g>
    <text x="518" y="29" fill="#1f2937" font-weight="700">Number limits (mobile example)</text>
    <text x="480" y="52" fill="#374151">Number questions use "More than" or "Less than" a</text>
    <text x="480" y="70" fill="#374151">limit, e.g. hours alone, age, or references given.</text>
    <a href="#us-004"><rect x="480" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="516" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-004</text></a>
    <a href="#fr-020"><rect x="558" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="594" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-020</text></a>

    <g class="callout"><circle cx="954" cy="24" r="14" fill="#dc2626"/><text x="954" y="29" text-anchor="middle" fill="#fff" font-weight="bold">3</text></g>
    <text x="978" y="29" fill="#1f2937" font-weight="700">Staff label and badge</text>
    <text x="940" y="52" fill="#374151">A short label of the manager's choosing, shown as a red</text>
    <text x="940" y="70" fill="#374151">badge on the application's dashboard card.</text>
    <a href="#us-004"><rect x="940" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="976" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-004</text></a>
    <a href="#us-002"><rect x="1018" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="1054" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-002</text></a>
    <a href="#fr-018"><rect x="1096" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="1132" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-018</text></a>

    <g class="callout"><circle cx="1414" cy="24" r="14" fill="#dc2626"/><text x="1414" y="29" text-anchor="middle" fill="#fff" font-weight="bold">4</text></g>
    <text x="1438" y="29" fill="#1f2937" font-weight="700">Never rejects, staff only</text>
    <text x="1400" y="52" fill="#374151">Staff still choose every status. Adopters never</text>
    <text x="1400" y="70" fill="#374151">see a flag in any screen or message.</text>
    <a href="#us-004"><rect x="1400" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="1436" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-004</text></a>
    <a href="#fr-021"><rect x="1478" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="1514" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-021</text></a>
    <a href="#fr-022"><rect x="1556" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="1592" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-022</text></a>
    <a href="#sc-005"><rect x="1634" y="78" width="72" height="22" rx="11" fill="#ea580c"/><text x="1670" y="94" text-anchor="middle" fill="#fff" font-weight="700">SC-005</text></a>

    <!-- Row 2 -->
    <g class="callout"><circle cx="34" cy="122" r="14" fill="#dc2626"/><text x="34" y="127" text-anchor="middle" fill="#fff" font-weight="bold">6</text></g>
    <text x="58" y="127" fill="#1f2937" font-weight="700">Turning a flag off</text>
    <text x="20" y="148" fill="#374151">Removes the rule for new applications only. Free-text</text>
    <text x="20" y="166" fill="#374151">questions have no flag button, so there's nothing to set.</text>
    <a href="#us-004"><rect x="20" y="172" width="72" height="22" rx="11" fill="#0891b2"/><text x="56" y="188" text-anchor="middle" fill="#fff" font-weight="700">US-004</text></a>
    <a href="#us-003"><rect x="98" y="172" width="72" height="22" rx="11" fill="#0891b2"/><text x="134" y="188" text-anchor="middle" fill="#fff" font-weight="700">US-003</text></a>
    <a href="#fr-009"><rect x="176" y="172" width="72" height="22" rx="11" fill="#2563eb"/><text x="212" y="188" text-anchor="middle" fill="#fff" font-weight="700">FR-009</text></a>
  </g>

  <text x="40" y="1060" font-family="system-ui, sans-serif" font-size="18" fill="#374151" font-weight="bold">049:03 | Red Flag Editor | ScriptHammer</text>
</svg>
