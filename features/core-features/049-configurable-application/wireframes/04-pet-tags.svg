  <!-- ===================== ANNOTATIONS ===================== -->
  <g id="annotations" transform="translate(40, 800)" font-family="system-ui, sans-serif" font-size="14">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>

    <g class="callout"><circle cx="34" cy="24" r="14" fill="#dc2626"/><text x="34" y="29" text-anchor="middle" fill="#fff" font-weight="bold">1</text></g>
    <text x="58" y="29" fill="#1f2937" font-weight="700">Tags on this pet</text>
    <text x="20" y="52" fill="#374151">As a rescue manager, I tag a listing so breed or</text>
    <text x="20" y="70" fill="#374151">senior questions apply only to that animal.</text>
    <a href="#us-005"><rect x="20" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="56" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-005</text></a>
    <a href="#fr-023"><rect x="98" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="134" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-023</text></a>

    <g class="callout"><circle cx="494" cy="24" r="14" fill="#dc2626"/><text x="494" y="29" text-anchor="middle" fill="#fff" font-weight="bold">2</text></g>
    <text x="518" y="29" fill="#1f2937" font-weight="700">Only matching groups appear</text>
    <text x="480" y="52" fill="#374151">Biscuit's applications include Sighthound and Senior.</text>
    <text x="480" y="70" fill="#374151">An untagged pet at the same rescue skips them.</text>
    <a href="#us-005"><rect x="480" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="516" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-005</text></a>
    <a href="#fr-011"><rect x="558" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="594" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-011</text></a>

    <g class="callout"><circle cx="954" cy="24" r="14" fill="#dc2626"/><text x="954" y="29" text-anchor="middle" fill="#fff" font-weight="bold">3</text></g>
    <text x="978" y="29" fill="#1f2937" font-weight="700">Species still filters too</text>
    <text x="940" y="52" fill="#374151">Dog-only bank questions stay off cat listings, even</text>
    <text x="940" y="70" fill="#374151">when a tag is on. Tags never override species.</text>
    <a href="#us-003"><rect x="940" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="976" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-003</text></a>
    <a href="#fr-001"><rect x="1018" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="1054" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-001</text></a>

    <g class="callout"><circle cx="1414" cy="24" r="14" fill="#dc2626"/><text x="1414" y="29" text-anchor="middle" fill="#fff" font-weight="bold">4</text></g>
    <text x="1438" y="29" fill="#1f2937" font-weight="700">Answers still reuse</text>
    <text x="1400" y="52" fill="#374151">An adopter who answered Senior once does not</text>
    <text x="1400" y="70" fill="#374151">retype it for the next tagged pet.</text>
    <a href="#us-001"><rect x="1400" y="78" width="72" height="22" rx="11" fill="#0891b2"/><text x="1436" y="94" text-anchor="middle" fill="#fff" font-weight="700">US-001</text></a>
    <a href="#fr-010"><rect x="1478" y="78" width="72" height="22" rx="11" fill="#2563eb"/><text x="1514" y="94" text-anchor="middle" fill="#fff" font-weight="700">FR-010</text></a>
  </g>

  <text x="40" y="1060" font-family="system-ui, sans-serif" font-size="18" fill="#374151" font-weight="bold">049:04 | Pet Tags on Listing | ScriptHammer</text>
</svg>
