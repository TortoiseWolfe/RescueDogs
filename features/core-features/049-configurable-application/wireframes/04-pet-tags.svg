      <rect x="276" y="118" width="108" height="44" rx="8" fill="#f5f0e6" stroke="#b8a080"/>
      <text x="330" y="145" text-anchor="middle" fill="#1f2937">Settings</text>

      <text x="40" y="192" fill="#1f2937" font-weight="600">&#8592; Back to Pets</text>
      <text x="40" y="226" fill="#1f2937" font-weight="700" font-size="20">Edit Biscuit</text>

