name: Local Supabase

# The admin dashboard specs and the admin RPC contract test need two things the
# shared hosted project cannot give them: an admin whose JWT we mint, and the
# demo data in supabase/seed-admin-demo.sql. So they run here, against a
# throwaway Supabase stack brought up from docker-compose.yml's `supabase`
# profile (#383).
#
# Separate from e2e.yml on purpose:
#  - it talks to its OWN database, so it does not join the e2e-supabase mutex
#    and cannot race (or be raced by) the hosted E2E runs;
#  - it holds no repository secrets. Every key below is the public Supabase
#    self-hosting demo key from .env.local-supabase.
#
# The same specs are not defined in e2e.yml (see tests/e2e/utils/local-supabase.ts),
# so no lane reports them as skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/rls/**'
      - 'tests/contract/admin/**'
      - 'tests/e2e/admin/**'
      - 'tests/e2e/auth/**'
      - 'tests/e2e/utils/local-supabase.ts'
      - 'src/**'
      - 'scripts/seed-*.ts'
      - 'docker-compose.yml'
      - 'docker/supabase/**'
      - 'vitest.rls.config.ts'
      - '.github/workflows/local-supabase.yml'
      - '.github/actions/local-supabase/**'
  workflow_dispatch:

concurrency:
  group: local-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-supabase:
    name: RLS + admin (local Supabase)
    # Playwright 1.55 has no ubuntu26.04 browsers; ubuntu-latest is 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The start and seed steps live in one place, shared with e2e.yml, so the
      # two workflows cannot drift apart.
      - name: Local Supabase (start, migrate, seed users, admin and rescue demo)
        uses: ./.github/actions/local-supabase
        with:
          admin-demo: 'true'

      - name: RLS suite and admin RPC contract
        run: pnpm test:rls

      - name: Build the app against the local stack
        run: pnpm build
        env:
          # Serve the build from the root, as e2e.yml does.
          DISABLE_BASE_PATH: 'true'
          GITHUB_ACTIONS: false

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Admin E2E
        run: |
          npx serve out -l 3000 > serve.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 60000
          pnpm exec playwright test tests/e2e/admin --project=chromium-gen \
            --reporter=line,json
        env:
          CI: 'true'
          # The setup project does the full per-job setup (second user, keys,
          # connections). Here each job owns its database, so nothing races.
          AUTH_SETUP_JOB: 'true'
          SKIP_WEBSERVER: 'true'
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: The admin specs must have run, and none may be skipped
        if: always()
        run: |
          # A lane that collects nothing is green and proves nothing: the specs
          # are defined only when SUPABASE_ADMIN_URL is set (#383).
          python3 - <<'PY'
          import json, sys
          r = json.load(open('results.json'))
          s = r['stats']
          print(f"expected={s['expected']} unexpected={s['unexpected']} flaky={s['flaky']} skipped={s['skipped']}")
          ok = s['expected'] >= 29 and s['unexpected'] == 0 and s['flaky'] == 0 and s['skipped'] == 0
          if not ok:
              sys.exit('admin lane: need >=29 passing tests with 0 failed, 0 flaky, 0 skipped')
          PY

      - name: Sign-up and rate-limit E2E (needs bot protection off)
        run: |
          # These specs are tagged @local-supabase. The hosted project enforces
          # a captcha on sign-up, so e2e.yml leaves them out; here the captcha is
          # off, so they run for real.
          pnpm exec playwright test \
            tests/e2e/auth/rate-limiting.spec.ts \
            tests/e2e/auth/sign-up.spec.ts \
            --project=rate-limiting --project=signup --no-deps \
            --grep @local-supabase --reporter=line,json
        env:
          CI: 'true'
          AUTH_SETUP_JOB: 'true'
          SKIP_WEBSERVER: 'true'
          BASE_URL: http://localhost:3000
          E2E_MAIL_SINK_DOMAIN: sink.example.test
          E2E_LOCAL_SUPABASE: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: results-signup.json

      - name: The sign-up and rate-limit specs must have run, and none may be skipped
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open('results-signup.json'))
          s = r['stats']
          print(f"expected={s['expected']} unexpected={s['unexpected']} flaky={s['flaky']} skipped={s['skipped']}")
          ok = s['expected'] >= 6 and s['unexpected'] == 0 and s['flaky'] == 0 and s['skipped'] == 0
          if not ok:
              sys.exit('sign-up lane: need >=6 passing tests with 0 failed, 0 flaky, 0 skipped')
          PY

      - name: Remember Me E2E (needs the real sign-in form, so bot protection off)
        run: |
          # Tagged @local-supabase (#457). With the captcha on, the sign-in
          # helper can only write a session and cannot tick Remember Me; here
          # the real form runs. The admin step above wrote the signed-out
          # storage state this spec starts from, hence --no-deps.
          pnpm exec playwright test \
            tests/e2e/auth/session-persistence.spec.ts \
            --project=chromium-gen --no-deps \
            --grep @local-supabase --reporter=line,json
        env:
          CI: 'true'
          AUTH_SETUP_JOB: 'true'
          SKIP_WEBSERVER: 'true'
          BASE_URL: http://localhost:3000
          E2E_LOCAL_SUPABASE: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: results-remember-me.json

      - name: The Remember Me spec must have run, and none may be skipped
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open('results-remember-me.json'))
          s = r['stats']
          print(f"expected={s['expected']} unexpected={s['unexpected']} flaky={s['flaky']} skipped={s['skipped']}")
          ok = s['expected'] >= 1 and s['unexpected'] == 0 and s['flaky'] == 0 and s['skipped'] == 0
          if not ok:
              sys.exit('remember-me lane: need >=1 passing test with 0 failed, 0 flaky, 0 skipped')
          PY

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose --profile supabase logs --tail=200

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-supabase-playwright-report
          path: |
            playwright-report/
            test-results/
            results.json
            results-signup.json
          retention-days: 7
          if-no-files-found: ignore
