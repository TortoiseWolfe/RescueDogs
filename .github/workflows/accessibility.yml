name: Accessibility Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  accessibility:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # SUPABASE_SERVICE_ROLE_KEY deliberately NOT set here (#298) — see the
      # longer note in ci.yml. This job runs `pnpm run build` and
      # `pnpm run test:a11y:ci` (serve out + pa11y) plus three component a11y
      # tests; none reads the key, and it is a required check with no
      # paths-ignore, so it was handing a production RLS-bypassing credential to
      # every PR including docs-only ones.
      # SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_PRIMARY_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
      TEST_USER_PRIMARY_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Run accessibility tests
        run: pnpm run test:a11y:ci

      - name: Run component accessibility tests
        run: pnpm test -- --run Button.accessibility Card.accessibility Text.accessibility

      - name: Upload Pa11y screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pa11y-screenshots
          path: .pa11y-screenshots/

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Accessibility tests failed. Please check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
